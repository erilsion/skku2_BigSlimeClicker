name: Unity Build

on:
  push:
    branches: [ web-build ]

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 0. 디스크 공간 확보
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # LFS 확인
      - name: Verify LFS
        run: |
          git lfs version
          git lfs ls-files || true
      
      # 2. 캐시 (빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-StandaloneWindows64-
            Library-${{ runner.os }}-
      
      # 3. Unity 빌드 (WebGL)
      - name: Build WebGL
        id: build_webgl
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: "Assets/Settings/Build Profiles/Web - Desktop - Release.asset"
          customParameters: -logFile "$GITHUB_WORKSPACE/Editor.log"
      
      # 4. 빌드 결과물 업로드
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL

      # 5. GitHub Pages 배포 준비
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Pages용 Artifact 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      # 7. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # 실패 원인 추출
      - name: Extract failure reason
        if: failure()
        id: fail_reason
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/Editor.log"

          echo "Unity log path: $LOG"
          if [ ! -f "$LOG" ]; then
            echo "summary=Unity Editor.log not found at $LOG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 최근 에러 메시지 20줄 추출
          SUMMARY=$(grep -nE "error CS[0-7]+:|Exception:|Build failed|Scripts have compiler errors" "$LOG" | tail -n 20 || true)

          # 에러 메시지가 없으면 마지막 80줄을 요약으로 사용
          if [ -z "$SUMMARY" ]; then
            SUMMARY=$(tail -n 80 "$LOG" || true)
          fi

          # 출력 설정
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 8. 슬랙 알림 (성공)
      - name: Slack Notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ WebGL 빌드 & 배포 성공",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *${{ github.repository }}* 빌드 & 배포 완료!\n📝 커밋: ${{ github.event.head_commit.message }}\n👤 작성자: ${{ github.actor }} (문경연)\n🌐 <https://erilsion.github.io/skku2_BigSlimeClicker/|플레이하기>"
                  }
                }
              ]
            }

      # 9. 슬랙 알림 (실패)
      - name: Slack Notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ WebGL 빌드 실패",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔥 *${{ github.repository }}* 빌드 실패!\n📝 커밋: ${{ github.event.head_commit.message }}\n👤 작성자: ${{ github.actor }}\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 확인>\n🖊️ 원인 요약:\n${{ steps.fail_reason.outputs.summary }}"
                  }
                }
              ]
            }