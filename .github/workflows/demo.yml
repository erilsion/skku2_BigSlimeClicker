name: Unity Build

on:
  push:
    branches: [ web-build ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 0. 디스크 공간 확보
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
      
      # 2. 캐시 (빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-
            Library-
      
      # Unity Personal 라이선스 복원
      - name: Activate Unity License
        run: |
          echo "${{ secrets.UNITY_LICENSE }}" | base64 --decode > Unity_lic.ulf

      # 3. Unity 빌드 (데스크탑)
      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: Unity_lic.ulf
        with:
          unityVersion: 6000.3.2f1
          targetPlatform: StandaloneWindows64
      
      # 4. 빌드 결과물 업로드
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build/StandaloneWindows64